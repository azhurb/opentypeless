[default]
# Git commit SHAs are cited throughout docs/, and hex digits routinely spell
# words — "4c7caf5" contains "caf", and dead/beef/fade/added are all valid hex.
# Ignoring backtick-quoted hex runs fixes the whole class instead of
# allowlisting each accident as it appears.
#
# The `<think>` stream filter (`src-tauri/src/llm/think.rs`) is all about tags
# arriving split across chunk boundaries, so its tests and docs deliberately
# contain truncated fragments — `<thi`, `"thi"` — which typos reads as "the".
extend-ignore-re = ["`[0-9a-f]{7,40}`", "<thi\\b", "\"thi\""]

[default.extend-words]
# Allow these "words" that typos might flag
cpal = "cpal"
stt = "stt"
llm = "llm"
byok = "byok"
hotkey = "hotkey"
# Fragments of hyphenated English compounds: typos splits on the hyphen, so
# "mis-fires" / "mis-parse" surface as "mis", and "look-alikes" as "alikes".
mis = "mis"
alikes = "alikes"

[files]
extend-exclude = [
  "*.lock",
  "node_modules/",
  "target/",
  "dist/",
  "*.min.js",
  "*.min.css",
  "CHANGELOG.md",
  # The README_<lang>.md exclusions that used to live here are gone: this fork
  # dropped the upstream README translations in 97a351d, so they only described
  # files that no longer exist.
]

[default.extend-identifiers]
